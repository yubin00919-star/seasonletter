<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마피아42 엽서 관리 Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        /* 기존 스타일 유지 */
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border: rgba(255,255,255,0.05);
            --input-bg: #0f172a;
        }

        body.light-mode {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: rgba(0,0,0,0.1);
            --input-bg: #f1f5f9;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); padding:16px; padding-bottom:100px; }
        .container { max-width:460px; margin:auto; }
       
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .title { font-size:24px; font-weight:800; }
        .theme-toggle { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 8px 12px; border-radius: 12px; cursor: pointer; font-size: 12px; font-weight: 700; }

        .card { background: var(--bg-card); border-radius:18px; padding:16px; margin-bottom:14px; border: 1px solid var(--border); }
        .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
        .stat { background: var(--bg-card); padding:15px; border-radius:16px; border:1px solid var(--border); text-align:center; }
        .label { font-size:12px; color: var(--text-sub); margin-bottom:4px; }
        .value { font-size:20px; font-weight:800; color:#38bdf8; }

        .menu-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:14px; }
        .menu-card { padding:15px 8px; border-radius:14px; text-align:center; cursor:pointer; transition: 0.2s; border: 1px solid rgba(0,0,0,0.05); }
        .menu-card:active { transform: scale(0.95); }
       
        .m-세배 { background: linear-gradient(135deg, #fef3c7 0%, #fcd34d 100%); color: #92400e; }
        .m-4기 { background: linear-gradient(135deg, #ede9fe 0%, #a78bfa 100%); color: #5b21b6; }
        .m-고귀 { background: linear-gradient(135deg, #f0f9ff 0%, #7dd3fc 100%); color: #075985; }
       
        .menu-card div { font-size:13px; font-weight:800; margin-top:5px; }
        .menu-card span { font-size:10px; opacity: 0.8; }

        .input, select { width:100%; background: var(--input-bg); border:1px solid var(--border); padding:12px; border-radius:12px; margin-top:8px; font-size:14px; color: var(--text-main); }
        .checkbox-row { display:flex; gap:8px; margin-top:15px; flex-wrap:wrap; }
        .check-label { background: var(--bg-card); border: 1px solid var(--border); padding:10px 14px; border-radius:12px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px; color: var(--text-main); flex:1; justify-content:center; }
       
        .btn { width:100%; border:none; padding:13px; border-radius:12px; font-weight:700; margin-top:15px; cursor:pointer; font-size:14px; }
        .primary { background:#2563eb; color:white; }
        .green { background:#059669; color:white; }
        .orange { background:#d97706; color:white; }
        .red { background:#b91c1c; color:white; margin-top:5px; font-size:12px; padding:8px; }
       
        .batch-btn { background:#34d399; color:#064e3b; padding:4px 8px; border-radius:6px; font-size:10px; border:none; font-weight: 700; cursor: pointer; }
        .delete-btn { background:#ef4444; color:white; padding:4px 8px; border-radius:6px; font-size:10px; border:none; cursor: pointer; }
       
        .partial-input-box { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:5px; margin-top:10px; padding:10px; background: rgba(0,0,0,0.1); border-radius:10px; }
        .partial-input-box label { font-size:11px; color: var(--text-sub); display:block; margin-bottom:3px; }
        .partial-input-box input { width:100%; background: var(--bg-card); border:1px solid var(--border); color: var(--text-main); padding:5px; border-radius:5px; font-size:12px; text-align:center; }
       
        .list-item { background: var(--bg-card); padding:15px; border-radius:16px; margin-top:10px; border: 1px solid var(--border); }
        .status-badge { display:inline-block; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:700; margin-bottom:5px; }
        .status-미완료 { background:#451a1a; color:#f87171; }
        .status-완료 { background:#064e3b; color:#34d399; }
        .status-일부지급 { background:#451a03; color:#fbbf24; }

        .nav-bar { position:fixed; bottom:0; left:0; right:0; background: var(--bg-card); display:flex; justify-content:space-around; padding:12px; border-top:1px solid var(--border); z-index:100; }
        .nav-item { text-align:center; font-size:11px; color: var(--text-sub); cursor:pointer; flex:1; }
        .nav-item.active { color:#38bdf8; font-weight:700; }
        .page { display:none; }
        .page.active { display:block; }

        .sort-bar { display: flex; gap: 8px; margin-bottom: 10px; }
        .sort-btn { flex: 1; padding: 6px; font-size: 11px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--text-sub); cursor: pointer; }
        .sort-btn.active { border-color: #38bdf8; color: #38bdf8; font-weight: 700; }

        /* [추가] 커스텀 모달 스타일 */
        #customModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: var(--bg-card); border-radius: 20px; padding: 24px; width: 100%; max-width: 340px;
            text-align: center; border: 1px solid var(--border);
        }
        .modal-text { margin-bottom: 24px; font-size: 15px; line-height: 1.5; color: var(--text-main); }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; font-size: 14px; }
        .btn-confirm { background: #2563eb; color: white; }
        .btn-cancel { background: var(--input-bg); color: var(--text-sub); border: 1px solid var(--border); }
    </style>
</head>
<body>

<!-- [추가] 커스텀 모달 레이아웃 -->
<div id="customModal">
    <div class="modal-content">
        <div class="modal-text" id="modalMessage">메시지 내용</div>
        <div class="modal-btns">
            <button class="modal-btn btn-confirm" id="confirmAction">확인</button>
            <button class="modal-btn btn-cancel" onclick="closeModal()">취소</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="header">
        <div>
            <div class="title">👸혜라👸</div>
            <div style="color:var(--text-sub); font-size:14px;">시말 엽서 판매 시스템</div>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">🌓 모드 변경</button>
    </div>

    <div id="page-home" class="page active">
        <div class="stats">
            <div class="stat"><div class="label">총합</div><div class="value" id="allCount">0</div></div>
            <div class="stat"><div class="label">미지급</div><div class="value" id="pendingCount" style="color:#f87171">0</div></div>
            <div class="stat"><div class="label">일부지급</div><div class="value" id="partialCount" style="color:#fbbf24">0</div></div>
            <div class="stat"><div class="label">지급완료</div><div class="value" id="doneCount" style="color:#34d399">0</div></div>
        </div>

        <div class="card">
            <div style="font-weight:700; margin-bottom:5px;">새 거래 추가</div>
            <input class="input" id="nickname" placeholder="상대방 닉네임 입력">
            <div class="checkbox-row" id="type-group">
                <label class="check-label"><input type="checkbox" value="세배"> 🧧 세배</label>
                <label class="check-label"><input type="checkbox" value="4기"> 💜 4기</label>
                <label class="check-label"><input type="checkbox" value="고귀"> 💎 고귀</label>
            </div>
            <button class="btn primary" onclick="addItem()">목록에 추가하기</button>
        </div>

        <div class="menu-grid">
            <div class="menu-card m-세배" onclick="filterList('세배')">
                🧧<div>세배</div><span id="m-count-세배">0건</span>
            </div>
            <div class="menu-card m-4기" onclick="filterList('4기')">
                💜<div>4기</div><span id="m-count-4기">0건</span>
            </div>
            <div class="menu-card m-고귀" onclick="filterList('고귀')">
                💎<div>고귀</div><span id="m-count-고귀">0건</span>
            </div>
        </div>

        <div class="card">
            <div style="display:flex; gap:8px;">
                <button class="btn green" style="flex:1; margin-top:15px;" onclick="downloadExcel()">엑셀 저장</button>
                <label class="btn orange" style="flex:1; margin-top:15px; display:flex; align-items:center; justify-content:center;">
                    불러오기 <input type="file" hidden onchange="importExcel(event)">
                </label>
            </div>
            <button class="btn red" onclick="askConfirm('모든 데이터를 삭제할까요?', resetAllData)">⚠️ 데이터 전체 초기화</button>
        </div>
    </div>

    <div id="page-list" class="page">
        <div class="sort-bar">
            <button class="sort-btn active" id="sort-new" onclick="setSort('new')">최신순</button>
            <button class="sort-btn" id="sort-old" onclick="setSort('old')">과거순</button>
            <button class="sort-btn" id="sort-name" onclick="setSort('name')">이름순</button>
        </div>
        <input type="text" id="searchInput" class="input" style="margin-bottom:10px; border-color:#38bdf8;" placeholder="닉네임으로 검색..." oninput="render()">
        <div id="list-title" style="font-weight:700; margin-bottom:10px; font-size:18px; margin-left:5px;">상세 내역</div>
        <div id="list-container"></div>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-item active" id="nav-home" onclick="showPage('home')">🏠<br>홈</div>
    <div class="nav-item" id="nav-세배" onclick="filterList('세배')">🧧<br>세배</div>
    <div class="nav-item" id="nav-4기" onclick="filterList('4기')">💜<br>4기</div>
    <div class="nav-item" id="nav-고귀" onclick="filterList('고귀')">💎<br>고귀</div>
    <div class="nav-item" id="nav-전체" onclick="filterList('전체')">📊<br>통합</div>
</nav>

<script>
let data = JSON.parse(localStorage.getItem('postcardManager')) || [];
let currentFilter = '전체';
let currentSort = 'new';

const priceRules = {
    "세배": { gam: 1, ju: 1, go: 0 },
    "4기": { gam: 2, ju: 1, go: 0 },
    "고귀": { gam: 1, ju: 0, go: 1 }
};

// [추가] 모달 제어 로직
function askConfirm(msg, callback) {
    document.getElementById('modalMessage').innerText = msg;
    document.getElementById('customModal').style.display = 'flex';
    document.getElementById('confirmAction').onclick = function() {
        callback();
        closeModal();
    };
}
function closeModal() { document.getElementById('customModal').style.display = 'none'; }

function save() { localStorage.setItem('postcardManager', JSON.stringify(data)); }

function resetAllData() { data = []; save(); render(); }

function toggleTheme() { document.body.classList.toggle('light-mode'); }

function setSort(sortType) {
    currentSort = sortType;
    document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('sort-' + sortType).classList.add('active');
    render();
}

function batchComplete(nick) {
    data.forEach(item => { if(item.nickname === nick) item.status = '완료'; });
    save(); render();
}

function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('page-' + (pageId === 'home' ? 'home' : 'list')).classList.add('active');
    if(pageId === 'home') document.getElementById('nav-home').classList.add('active');
}

function addItem() {
    const nick = document.getElementById('nickname').value.trim();
    const selectedTypes = Array.from(document.querySelectorAll('#type-group input:checked')).map(cb => cb.value);
   
    if (selectedTypes.length === 0 || !nick) { alert('닉네임과 종류를 선택하세요!'); return; }
   
    const isDuplicate = data.some(item => item.nickname === nick);
    if (isDuplicate) {
        askConfirm(`⚠️ [${nick}]님은 이미 목록에 존재합니다. 추가로 등록하시겠습니까?`, () => {
            executeAdd(nick, selectedTypes);
        });
    } else {
        executeAdd(nick, selectedTypes);
    }
}

function executeAdd(nick, selectedTypes) {
    selectedTypes.forEach(type => {
        data.unshift({
            id: Date.now() + Math.random(),
            nickname: nick, type: type, amount: 1, status: '미완료', p_gam: 0, p_ju: 0, p_go: 0,
            date: new Date().toISOString()
        });
    });
    save(); render();
    document.getElementById('nickname').value = '';
    document.querySelectorAll('#type-group input').forEach(cb => cb.checked = false);
}

function updateStatus(id, newStatus) {
    const item = data.find(v => v.id === id);
    if (item) { item.status = newStatus; save(); render(); }
}

function updatePartial(id, field, val) {
    const item = data.find(v => v.id === id);
    if (item) { item[field] = Number(val) || 0; save(); render(); }
}

function deleteUser(nick) { data = data.filter(item => item.nickname !== nick); save(); render(); }

function deleteItem(id) { data = data.filter(item => item.id !== id); save(); render(); }

function filterList(type) {
    currentFilter = type;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const navId = type === '전체' ? 'nav-전체' : 'nav-' + type;
    if(document.getElementById(navId)) document.getElementById(navId).classList.add('active');
    document.getElementById('list-title').innerText = type === '전체' ? "유저별 통합 관리" : type + " 상세 내역";
    showPage('list'); render();
}

function render() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const listContainer = document.getElementById('list-container');
    listContainer.innerHTML = '';

    document.getElementById('allCount').innerText = data.length;
    document.getElementById('pendingCount').innerText = data.filter(v => v.status === '미완료').length;
    document.getElementById('partialCount').innerText = data.filter(v => v.status === '일부지급').length;
    document.getElementById('doneCount').innerText = data.filter(v => v.status === '완료').length;
   
    document.getElementById('m-count-세배').innerText = data.filter(v => v.type === '세배').length + '건';
    document.getElementById('m-count-4기').innerText = data.filter(v => v.type === '4기').length + '건';
    document.getElementById('m-count-고귀').innerText = data.filter(v => v.type === '고귀').length + '건';

    let base = data.filter(v => v.nickname.toLowerCase().includes(search));

    if (currentSort === 'new') base.sort((a, b) => new Date(b.date) - new Date(a.date));
    else if (currentSort === 'old') base.sort((a, b) => new Date(a.date) - new Date(b.date));
    else if (currentSort === 'name') base.sort((a, b) => a.nickname.localeCompare(b.nickname));

    const tabData = currentFilter === '전체' ? base : base.filter(v => v.type === currentFilter);

    if (currentFilter === '전체') {
        const grouped = tabData.reduce((acc, curr) => {
            if (!acc[curr.nickname]) acc[curr.nickname] = { list: [], totalGam: 0, totalJu: 0, totalGo: 0 };
            acc[curr.nickname].list.push(curr);
            if (curr.status !== '완료') {
                const rule = priceRules[curr.type] || {gam:0, ju:0, go:0};
                acc[curr.nickname].totalGam += (rule.gam * curr.amount) - (curr.p_gam || 0);
                acc[curr.nickname].totalJu += (rule.ju * curr.amount) - (curr.p_ju || 0);
                acc[curr.nickname].totalGo += (rule.go * curr.amount) - (curr.p_go || 0);
            }
            return acc;
        }, {});

        Object.keys(grouped).forEach(nick => {
            const user = grouped[nick];
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <span style="font-weight:800; color:#38bdf8; font-size:15px;">👤 ${nick}</span>
                    <div style="display:flex; gap:5px;">
                        <button class="batch-btn" onclick="askConfirm('[${nick}]님의 모든 내역을 완료 처리할까요?', () => batchComplete('${nick}'))">일괄완료</button>
                        <button class="delete-btn" onclick="askConfirm('[${nick}]님의 모든 데이터를 삭제할까요?', () => deleteUser('${nick}'))">전체삭제</button>
                    </div>
                </div>
                <div style="font-size:12px; color: var(--text-sub);">
                    ${user.list.map(it => `<div style="margin-bottom:4px;">• ${it.type} [${it.status}]</div>`).join('')}
                    <div style="margin-top:10px; padding:10px; background:rgba(0,0,0,0.2); border-radius:10px; color:#fbbf24;">
                        <b>💰 남은 정산:</b> 깜 ${user.totalGam} / 주 ${user.totalJu} / 고 ${user.totalGo}
                    </div>
                </div>
            `;
            listContainer.appendChild(div);
        });
    } else {
        tabData.forEach(item => {
            const rule = priceRules[item.type] || {gam:0, ju:0, go:0};
            const isDone = item.status === '완료';
            const leftGam = isDone ? 0 : (rule.gam * item.amount) - item.p_gam;
            const leftJu = isDone ? 0 : (rule.ju * item.amount) - item.p_ju;
            const leftGo = isDone ? 0 : (rule.go * item.amount) - item.p_go;

            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between;">
                    <span class="status-badge status-${item.status}">${item.status}</span>
                    <button class="delete-btn" onclick="askConfirm('이 내역을 삭제할까요?', () => deleteItem(${item.id}))">삭제</button>
                </div>
                <div style="font-weight:800; margin-bottom:5px; font-size:14px;">${item.nickname}</div>
                <div style="font-size:12px; color:#34d399; margin-bottom:10px; padding:8px; background:rgba(0,0,0,0.1); border-radius:8px;">
                    💰 남은 지급액: <b>깜 ${leftGam} / 주 ${leftJu} / 고 ${leftGo}</b>
                </div>
                <select class="input" style="padding:8px; font-size:12px; margin-top:0;" onchange="updateStatus(${item.id}, this.value)">
                    <option value="미완료" ${item.status==='미완료'?'selected':''}>미완료</option>
                    <option value="일부지급" ${item.status==='일부지급'?'selected':''}>일부지급 (수량 입력)</option>
                    <option value="완료" ${item.status==='완료'?'selected':''}>지급완료</option>
                </select>
                ${item.status === '일부지급' ? `
                <div class="partial-input-box">
                    <div><label>깜 지급액</label><input type="number" value="${item.p_gam}" oninput="updatePartial(${item.id}, 'p_gam', this.value)"></div>
                    <div><label>주 지급액</label><input type="number" value="${item.p_ju}" oninput="updatePartial(${item.id}, 'p_ju', this.value)"></div>
                    <div><label>고 지급액</label><input type="number" value="${item.p_go}" oninput="updatePartial(${item.id}, 'p_go', this.value)"></div>
                </div>` : ''}
            `;
            listContainer.appendChild(div);
        });
    }
}

function downloadExcel() {
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Data");
    XLSX.writeFile(wb, "Postcard_Data.xlsx");
}

function importExcel(event) {
    const file = event.target.files[0];
    const reader = new FileReader();
    reader.onload = function(e) {
        data = XLSX.utils.sheet_to_json(XLSX.read(e.target.result, {type:'binary'}).Sheets["Data"]);
        save(); render();
    };
    reader.readAsBinaryString(file);
}

render();
</script>
</body>
</html>
